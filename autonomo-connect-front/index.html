<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>ObraFácil | Profissionais de Confiança</title>
    <meta name="description" content="Conecte-se aos melhores profissionais da construção e manutenção. Pedreiros, eletricistas e encanadores avaliados perto de você." />
    <meta name="theme-color" content="#ea580c" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="shortcut icon" href="/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
      /* CORREÇÃO AQUI: Removi 'overflow: hidden' que travava a rolagem */
      body { 
        margin: 0; 
        padding: 0; 
        background-color: #f8fafc; 
        font-family: 'Inter', sans-serif; 
        /* overflow: hidden;  <-- ESTA LINHA FOI REMOVIDA */
      }
      
      #root-loader {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        background: #f8fafc;
        transition: opacity 0.4s ease-out;
      }

      .loader-logo-box {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -5px rgba(234, 88, 12, 0.4);
        margin-bottom: 24px;
        animation: float 3s ease-in-out infinite;
      }

      .loader-logo-text {
        color: white;
        font-size: 32px;
        font-weight: 700;
        font-family: sans-serif;
      }

      .loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e2e8f0;
        border-top-color: #ea580c;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .loader-text {
        margin-top: 16px;
        color: #64748b;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.5px;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="root-loader">
        <div class="loader-logo-box">
          <span class="loader-logo-text">O</span>
        </div>
        <div class="loader-spinner"></div>
        <p class="loader-text">Carregando ObraFácil...</p>
      </div>
    </div>
    <noscript>
      <div style="padding: 20px; text-align: center; color: #333;">
        Você precisa habilitar o JavaScript para usar o ObraFácil.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
