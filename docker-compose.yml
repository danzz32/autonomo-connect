# docker-compose.yml na raiz
version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app # Hot reload no Python
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app      # Sincroniza sua pasta local com o container
      - /app/node_modules    # Evita conflito de node_modules
    ports:
      - "5173:5173"
    command: yarn dev --host